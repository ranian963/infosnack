components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: infosnack_at
      description: FastAPI-owned HttpOnly access JWT cookie for web frontend sessions.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token matching the non-HttpOnly infosnack_csrf cookie.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: FastAPI-issued scoped token for browser extension and API clients.

  headers:
    SetCookie:
      description: >
        Sets or clears infosnack_at, infosnack_rt, and/or infosnack_csrf cookies.
        Production cookies are Secure and SameSite=Lax. access and refresh cookies
        are HttpOnly; CSRF cookie is readable by the frontend.
      schema:
        type: string
    RetryAfter:
      description: Seconds until the client should retry.
      schema:
        type: integer
        minimum: 0

  parameters:
    WorkspaceIdHeader:
      name: X-Workspace-Id
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    WorkspaceIdHeaderOptional:
      name: X-Workspace-Id
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/Uuid"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 200
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
        description: SSE resume cursor formatted as run_id:sequence.
    WebhookEventIdHeader:
      name: X-InfoSnack-Event-Id
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    WebhookTimestampHeader:
      name: X-InfoSnack-Timestamp
      in: header
      required: true
      schema:
        type: string
        format: date-time
    WebhookSignatureHeader:
      name: X-InfoSnack-Signature
      in: header
      required: true
      schema:
        type: string
        description: HMAC-SHA256 signature over timestamp and request body for custom webhook targets.
    WebhookRetryCountHeader:
      name: X-InfoSnack-Retry-Count
      in: header
      required: true
      schema:
        type: integer
        minimum: 0
        description: Zero for the first delivery attempt, incremented for retries.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: [string, "null"]
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 500
    SearchQueryRequired:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 500
    SourceIdQuery:
      name: source_id
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Uuid"
    SourceTypeQuery:
      name: source_type
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/SourceType"
    ContentSortQuery:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [latest, relevance, unread_first, favorite_first]
        default: latest
    SearchSortQuery:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [relevance, latest, unread_first, favorite_first]
        default: relevance
    FromDate:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    ToDate:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    ContentStatusQuery:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ContentStatus"
    ContentTypeQuery:
      name: content_type
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ContentType"
    TagQuery:
      name: tag
      in: query
      required: false
      schema:
        type: string
        maxLength: 80
    CollectionIdQuery:
      name: collection_id
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Uuid"
    ReadStatusQuery:
      name: read_status
      in: query
      required: false
      schema:
        type: string
        enum: [unread, read, archived]
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    InvitationToken:
      name: invitation_token
      in: path
      required: true
      schema:
        type: string
        minLength: 24
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    CredentialId:
      name: credential_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    CaptureId:
      name: capture_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ContentId:
      name: content_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    CollectionId:
      name: collection_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    DigestId:
      name: digest_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ChatThreadId:
      name: chat_thread_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ShareId:
      name: share_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ShareToken:
      name: share_token
      in: path
      required: true
      schema:
        type: string
        minLength: 24
    ExportJobId:
      name: export_job_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    JobRunId:
      name: job_run_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"

  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permission in the same workspace or instance scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found or foreign workspace resource hidden by enumeration policy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Duplicate, replay, stale state, or conflicting resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limited.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Uuid:
      type: string
      format: uuid
    DateTime:
      type: string
      format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          examples: [validation_error, unauthorized, forbidden, not_found, conflict, csrf_failed]
        message:
          type: string
          description: Backend message key or safe user-facing summary.
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string
    HealthResponse:
      type: object
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ok, degraded, down]
    Role:
      type: string
      enum: [super_admin, owner, admin, member, viewer]
    User:
      type: object
      required: [id, email, name, locale, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        email:
          type: string
          format: email
        name:
          type: string
        avatar_url:
          type: [string, "null"]
          format: uri
        locale:
          type: string
          enum: [ko, en]
          default: ko
        is_super_admin:
          type: boolean
          default: false
        created_at:
          $ref: "#/components/schemas/DateTime"
    UserProfileUpdateRequest:
