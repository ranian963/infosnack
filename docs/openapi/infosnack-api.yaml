openapi: 3.1.0
info:
  title: InfoSnack API
  version: 3.0.0
  summary: InfoSnack v3 backend and BFF API contract
  description: >
    OpenAPI 3.1 contract for InfoSnack v3. Every dynamic UI read, user action,
    browser extension action, automatic collection action, worker/admin action,
    export, share, notification, and outgoing webhook payload must be represented
    by this contract. Next.js may act as a BFF, but it must call or expose the
    same schema semantics defined here. Authentication is owned by FastAPI using
    HttpOnly cookies, CSRF double-submit, and scoped bearer tokens for extension
    or API clients.
servers:
  - url: /
    description: Same-origin backend API root. Paths include the /api prefix.
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: System
  - name: Auth
  - name: Invitations
  - name: Workspaces
  - name: Users
  - name: Dashboard
  - name: Captures
  - name: Contents
  - name: Collections
  - name: Tags
  - name: Credentials
  - name: Sources
  - name: Search
  - name: Chat
  - name: Digests
  - name: Shares
  - name: Exports
  - name: Notifications
  - name: Webhooks
  - name: Extension
  - name: Admin

paths:
  /api/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check API and dependency health.
      security: []
      x-required-role: public
      x-workspace-scope: none
      x-enumeration-policy: not_applicable
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password.
      security: []
      x-required-role: public
      x-workspace-scope: none
      x-enumeration-policy: not_applicable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session. Sets access, refresh, and CSRF cookies.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current refresh token and clear auth cookies.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: authenticated
      x-workspace-scope: none
      x-enumeration-policy: not_applicable
      responses:
        "204":
          description: Session revoked and cookies cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate refresh token and issue a new access token.
      security:
        - cookieAuth: []
          csrfHeader: []
      x-required-role: authenticated
      x-workspace-scope: none
      x-enumeration-policy: not_applicable
      responses:
        "200":
          description: Refreshed session cookies and user context.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Refresh replay detected. Token family has been revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentSession
      summary: Get current user and workspace memberships.
      x-required-role: authenticated
      x-workspace-scope: none
      x-enumeration-policy: not_applicable
      responses:
        "200":
          description: Current authenticated principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/register:
    post:
      tags: [Auth]
      operationId: registerWithInvitation
      summary: Register using an invitation token.
      security: []
      x-required-role: public
      x-workspace-scope: invitation_token
      x-enumeration-policy: invalid_token_returns_404
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created and session cookies issued.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/invitations:
    post:
      tags: [Invitations]
      operationId: createInvitation
      summary: Create a workspace invitation.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: admin
      x-workspace-scope: selected
      x-enumeration-policy: same_workspace_role_shortage_returns_403
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreateRequest"
      responses:
        "201":
          description: Invitation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/invitations/{invitation_token}:
    get:
      tags: [Invitations]
      operationId: getInvitationStatus
      summary: Get public invitation status before registration.
      security: []
      x-required-role: public
      x-workspace-scope: invitation_token
      x-enumeration-policy: invalid_token_returns_404
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: Invitation status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationStatus"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/invitations/{invitation_id}/revoke:
    post:
      tags: [Invitations]
      operationId: revokeInvitation
      summary: Revoke an unused invitation.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: admin
      x-workspace-scope: selected
      x-enumeration-policy: foreign_workspace_returns_404
      parameters:
        - $ref: "#/components/parameters/InvitationId"
        - $ref: "#/components/parameters/WorkspaceIdHeader"
      responses:
        "200":
          description: Revoked invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Get dashboard aggregates and health summaries.
      x-required-role: viewer
      x-workspace-scope: selected
      x-enumeration-policy: foreign_workspace_returns_404
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdHeader"
      responses:
        "200":
          description: Dashboard aggregate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List workspaces visible to the current user.
      x-required-role: authenticated
      x-workspace-scope: none
      x-enumeration-policy: not_applicable
      responses:
        "200":
          description: Workspace memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/workspaces/{workspace_id}:
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Get workspace settings.
      x-required-role: viewer
      x-workspace-scope: path
      x-enumeration-policy: foreign_workspace_returns_404
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      summary: Update workspace settings.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: admin
      x-workspace-scope: path
      x-enumeration-policy: foreign_workspace_returns_404
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdateRequest"
      responses:
        "200":
          description: Updated workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      summary: Soft-delete a workspace.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: owner
      x-workspace-scope: path
      x-enumeration-policy: foreign_workspace_returns_404
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "204":
          description: Workspace soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/workspaces/{workspace_id}/purge:
    post:
      tags: [Workspaces]
      operationId: purgeWorkspace
      summary: Permanently purge a previously deleted workspace and its owned resources.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: owner
      x-workspace-scope: path
      x-enumeration-policy: foreign_workspace_returns_404
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Workspace purge job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/workspaces/{workspace_id}/members:
    get:
      tags: [Workspaces]
      operationId: listWorkspaceMembers
      summary: List workspace members.
      x-required-role: admin
      x-workspace-scope: path
      x-enumeration-policy: foreign_workspace_returns_404
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMemberListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/workspaces/{workspace_id}/members/{user_id}:
    patch:
      tags: [Workspaces]
      operationId: updateWorkspaceMember
      summary: Update a workspace member role.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: admin
      x-workspace-scope: path
      x-enumeration-policy: foreign_workspace_returns_404
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceMemberUpdateRequest"
      responses:
        "200":
          description: Updated membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMembership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Workspaces]
      operationId: removeWorkspaceMember
      summary: Remove a member from a workspace.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: admin
      x-workspace-scope: path
      x-enumeration-policy: foreign_workspace_returns_404
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Member removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/users/me/profile:
    patch:
      tags: [Users]
      operationId: updateCurrentUserProfile
      summary: Update the current user profile.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: authenticated
      x-workspace-scope: none
      x-enumeration-policy: not_applicable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdateRequest"
      responses:
        "200":
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/credentials:
    get:
      tags: [Credentials]
      operationId: listCredentials
      summary: List workspace credentials with secret values redacted.
      x-required-role: admin
      x-workspace-scope: selected
      x-enumeration-policy: foreign_workspace_returns_404
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdHeader"
      responses:
        "200":
          description: Redacted credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Credentials]
      operationId: createCredential
      summary: Create an encrypted workspace credential.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: admin
      x-workspace-scope: selected
      x-enumeration-policy: foreign_workspace_returns_404
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialCreateRequest"
      responses:
        "201":
          description: Created redacted credential metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/credentials/{credential_id}:
    patch:
      tags: [Credentials]
      operationId: updateCredential
      summary: Update credential metadata or replace encrypted secret fields.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: admin
      x-workspace-scope: selected
      x-enumeration-policy: foreign_workspace_returns_404
      parameters:
        - $ref: "#/components/parameters/CredentialId"
        - $ref: "#/components/parameters/WorkspaceIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialUpdateRequest"
      responses:
        "200":
          description: Updated redacted credential metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Credentials]
      operationId: deleteCredential
      summary: Delete a workspace credential and mark dependent sources as needing credentials.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: admin
      x-workspace-scope: selected
      x-enumeration-policy: foreign_workspace_returns_404
      parameters:
        - $ref: "#/components/parameters/CredentialId"
        - $ref: "#/components/parameters/WorkspaceIdHeader"
      responses:
        "204":
          description: Credential deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/credentials/{credential_id}/test:
    post:
      tags: [Credentials]
      operationId: testCredential
      summary: Test a credential without returning secret values.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: admin
      x-workspace-scope: selected
      x-enumeration-policy: foreign_workspace_returns_404
      parameters:
        - $ref: "#/components/parameters/CredentialId"
        - $ref: "#/components/parameters/WorkspaceIdHeader"
      responses:
        "200":
          description: Credential test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/system-credentials:
    get:
      tags: [Credentials]
      operationId: listSystemCredentials
      summary: List system credential metadata.
      x-required-role: super_admin
      x-workspace-scope: instance
      x-enumeration-policy: same_instance_role_shortage_returns_403
      responses:
        "200":
          description: Redacted system credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Credentials]
      operationId: createSystemCredential
      summary: Create a system credential.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: super_admin
      x-workspace-scope: instance
      x-enumeration-policy: same_instance_role_shortage_returns_403
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialCreateRequest"
      responses:
        "201":
          description: Created redacted system credential metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/system-credentials/{credential_id}:
    patch:
      tags: [Credentials]
      operationId: updateSystemCredential
      summary: Update system credential metadata or rotate secret fields.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: super_admin
      x-workspace-scope: instance
      x-enumeration-policy: same_instance_role_shortage_returns_403
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialUpdateRequest"
      responses:
        "200":
          description: Updated redacted system credential metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Credentials]
      operationId: deleteSystemCredential
      summary: Delete a system credential.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: super_admin
      x-workspace-scope: instance
      x-enumeration-policy: same_instance_role_shortage_returns_403
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "204":
          description: System credential deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/captures/url:
    post:
      tags: [Captures]
      operationId: createUrlCapture
      summary: Capture a URL and enqueue background processing.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: member
      x-workspace-scope: selected
      x-enumeration-policy: foreign_workspace_returns_404
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UrlCaptureRequest"
      responses:
        "202":
          description: Capture accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/captures/text:
    post:
      tags: [Captures]
      operationId: createTextCapture
      summary: Capture direct text, note content, or browser selection text.
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
      x-required-role: member
      x-workspace-scope: selected
      x-enumeration-policy: foreign_workspace_returns_404
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
