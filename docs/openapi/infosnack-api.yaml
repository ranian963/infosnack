    DashboardStats:
      type: object
      required: [weekly_capture_count, unread_count, previous_week_capture_delta]
      properties:
        weekly_capture_count:
          type: integer
          minimum: 0
        unread_count:
          type: integer
          minimum: 0
        previous_week_capture_delta:
          type: integer
    AdminUser:
      type: object
      required: [id, email, name, locale, is_super_admin, locked_until, deleted_at, membership_count, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        email:
          type: string
          format: email
        name:
          type: string
        locale:
          type: string
          enum: [ko, en]
        is_super_admin:
          type: boolean
        locked_until:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        deleted_at:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        membership_count:
          type: integer
          minimum: 0
        created_at:
          $ref: "#/components/schemas/DateTime"
    AdminUserPage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
    AdminOverview:
      type: object
      required: [active_users, captures, failures, cost_estimate]
      properties:
        active_users:
          type: integer
        captures:
          type: integer
        failures:
          type: integer
        cost_estimate:
          type: number
    ModelAdminState:
      type: object
      required: [providers, usage]
      properties:
        providers:
          type: array
          items:
            type: object
            additionalProperties: true
        usage:
          type: object
          additionalProperties: true
    StorageAdminState:
      type: object
      required: [object_count, bytes_used, purge_jobs]
      properties:
        object_count:
          type: integer
        bytes_used:
          type: integer
        purge_jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobRun"
    DigestPublishedEvent:
      type: object
      required: [event_type, event_id, occurred_at, workspace_id, digest]
      properties:
        event_type:
          const: digest.published
        event_id:
          $ref: "#/components/schemas/Uuid"
        occurred_at:
          $ref: "#/components/schemas/DateTime"
        workspace_id:
          $ref: "#/components/schemas/Uuid"
        digest:
          $ref: "#/components/schemas/Digest"
    SourceFailedEvent:
      type: object
      required: [event_type, event_id, occurred_at, workspace_id, source, redacted_error]
      properties:
        event_type:
          type: string
          enum: [source.failed, source.needs_credential, source.paused]
        event_id:
          $ref: "#/components/schemas/Uuid"
        occurred_at:
          $ref: "#/components/schemas/DateTime"
        workspace_id:
          $ref: "#/components/schemas/Uuid"
        source:
          $ref: "#/components/schemas/Source"
        redacted_error:
          type: string
    PipelineFailedEvent:
      type: object
      required: [event_type, event_id, occurred_at, workspace_id, content_id, job_run_id, redacted_error]
      properties:
        event_type:
          const: pipeline.failed
        event_id:
          $ref: "#/components/schemas/Uuid"
        occurred_at:
          $ref: "#/components/schemas/DateTime"
        workspace_id:
          $ref: "#/components/schemas/Uuid"
        content_id:
          $ref: "#/components/schemas/Uuid"
        job_run_id:
          $ref: "#/components/schemas/Uuid"
        redacted_error:
          type: string
